name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync wiki pages to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout or initialize wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if ! git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "Wiki repository not found. Initializing via GitHub API..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/wiki/pages" \
              -f title="Home" \
              -f content="# Initializing..."
            sleep 3  # give GitHub time to provision the new wiki repository
            git clone "$WIKI_URL" wiki-repo || { echo "Failed to clone wiki after initialization"; exit 1; }
          else
            echo "Wiki repository cloned successfully"
          fi

      - name: Copy wiki pages
        run: |
          cp -r wiki/. wiki-repo/

      - name: Push changes to wiki
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git rev-parse HEAD > /dev/null 2>&1; then
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "docs: sync wiki from main repository"
              git push origin HEAD:master
            fi
          else
            git commit -m "docs: sync wiki from main repository"
            git push origin HEAD:master
          fi
